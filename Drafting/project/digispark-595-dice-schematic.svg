<g font-size="12" fill="#333">
<text x="40" y="605">/OE to GND = outputs always on. SRCLR to +5V = register never cleared. QH (DP) and QH' are unused.</text>
<text x="40" y="623">Segments: QA=a, QB=b, QC=c, QD=d, QE=e, QF=f, QG=g. Place C1 right next to the 595 VCC and GND pins.</text>
<text x="40" y="641">Power from the USB plug (5V). For batteries, use the 5V pin, not VIN.</text>
