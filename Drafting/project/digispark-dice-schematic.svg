<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="880" height="640" fill="#ffffff"/>
<text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Digispark ATtiny85 Digital Dice - Schematic</text>

<!-- rails -->
<line x1="40" y1="60" x2="840" y2="60" stroke="#c0392b" stroke-width="3"/>
<line x1="40" y1="570" x2="840" y2="570" stroke="#1f4e79" stroke-width="3"/>
<text x="46" y="52" font-size="13" font-weight="bold" fill="#c0392b">+5V</text>
<text x="46" y="562" font-size="13" font-weight="bold" fill="#1f4e79">GND</text>

<g stroke="#111" stroke-width="2" fill="none">
<!-- Digispark -->
<rect x="60" y="100" width="140" height="240" fill="#f1f4f7"/>
<line x1="40" y1="60" x2="40" y2="160"/><line x1="40" y1="160" x2="60" y2="160"/>
<line x1="40" y1="300" x2="60" y2="300"/><line x1="40" y1="300" x2="40" y2="570"/>
<line x1="200" y1="160" x2="360" y2="160"/>
<line x1="200" y1="190" x2="360" y2="190"/>
<line x1="200" y1="220" x2="360" y2="220"/>
<line x1="200" y1="300" x2="250" y2="300"/>

<!-- button -->
<line x1="250" y1="300" x2="250" y2="425"/>
<circle cx="250" cy="425" r="3" fill="#111"/><circle cx="250" cy="455" r="3" fill="#111"/>
<line x1="250" y1="455" x2="238" y2="430"/>
<line x1="250" y1="455" x2="250" y2="570"/>

<!-- decoder -->
<rect x="360" y="100" width="140" height="330" fill="#f1f4f7"/>
<line x1="430" y1="60" x2="430" y2="100"/><line x1="430" y1="430" x2="430" y2="570"/>
<line x1="360" y1="280" x2="335" y2="280"/><line x1="360" y1="310" x2="335" y2="310"/>
<line x1="335" y1="252" x2="335" y2="310"/>
<line x1="360" y1="370" x2="335" y2="370"/><line x1="360" y1="400" x2="335" y2="400"/>
<line x1="335" y1="370" x2="335" y2="570"/>

<!-- segment wires + resistors -->
<g id="seg">
<line x1="500" y1="130" x2="545" y2="130"/><rect x="545" y="123" width="50" height="14" fill="#fff"/><line x1="595" y1="130" x2="660" y2="130"/>
<line x1="500" y1="165" x2="545" y2="165"/><rect x="545" y="158" width="50" height="14" fill="#fff"/><line x1="595" y1="165" x2="660" y2="165"/>
<line x1="500" y1="200" x2="545" y2="200"/><rect x="545" y="193" width="50" height="14" fill="#fff"/><line x1="595" y1="200" x2="660" y2="200"/>
<line x1="500" y1="235" x2="545" y2="235"/><rect x="545" y="228" width="50" height="14" fill="#fff"/><line x1="595" y1="235" x2="660" y2="235"/>
<line x1="500" y1="270" x2="545" y2="270"/><rect x="545" y="263" width="50" height="14" fill="#fff"/><line x1="595" y1="270" x2="660" y2="270"/>
<line x1="500" y1="305" x2="545" y2="305"/><rect x="545" y="298" width="50" height="14" fill="#fff"/><line x1="595" y1="305" x2="660" y2="305"/>
<line x1="500" y1="340" x2="545" y2="340"/><rect x="545" y="333" width="50" height="14" fill="#fff"/><line x1="595" y1="340" x2="660" y2="340"/>
</g>

<!-- display -->
<rect x="660" y="100" width="150" height="300" fill="#f1f4f7"/>
<line x1="735" y1="400" x2="735" y2="570"/>
</g>

<!-- junction dots -->
<g fill="#111">
<circle cx="40" cy="60" r="4"/><circle cx="40" cy="570" r="4"/>
<circle cx="250" cy="570" r="4"/><circle cx="335" cy="570" r="4"/>
<circle cx="430" cy="60" r="4"/><circle cx="430" cy="570" r="4"/>
<circle cx="735" cy="570" r="4"/>
<circle cx="335" cy="280" r="4"/><circle cx="335" cy="400" r="4"/>
</g>

<!-- +5V tag -->
<text x="335" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">+5V</text>

<!-- Digispark text -->
<g font-size="12" fill="#111">
<text x="130" y="120" text-anchor="middle" font-weight="bold" font-size="13">Digispark</text>
<text x="130" y="136" text-anchor="middle" font-weight="bold" font-size="13">ATtiny85 (U1)</text>
<text x="68" y="164">5V</text><text x="68" y="304">GND</text>
<text x="192" y="164" text-anchor="end">P0 (PB0)</text>
<text x="192" y="194" text-anchor="end">P1 (PB1)</text>
<text x="192" y="224" text-anchor="end">P2 (PB2)</text>
<text x="192" y="304" text-anchor="end">P3 (PB3)</text>
<text x="130" y="250" text-anchor="middle" font-size="11" fill="#555">USB plug = 5V in</text>
<text x="130" y="266" text-anchor="middle" font-size="11" fill="#555">P4, P5 unused</text>

<text x="272" y="156" font-size="11" fill="#555">BCD A (bit 0)</text>
<text x="272" y="186" font-size="11" fill="#555">BCD B (bit 1)</text>
<text x="272" y="216" font-size="11" fill="#555">BCD C (bit 2)</text>
<text x="262" y="436" font-size="12">SW1</text>
<text x="262" y="450" font-size="11" fill="#555">push button</text>
<text x="262" y="464" font-size="11" fill="#555">(press = GND)</text>
<text x="208" y="318" font-size="10" fill="#555">internal pull-up</text>
</g>

<!-- decoder text -->
<g font-size="12" fill="#111">
<text x="430" y="254" text-anchor="middle" font-weight="bold" font-size="13">74HC4511</text>
<text x="430" y="268" text-anchor="middle" font-size="11">U2 (BCD to 7-seg)</text>
<text x="368" y="164">A</text><text x="368" y="194">B</text><text x="368" y="224">C</text>
<text x="368" y="284">/LT</text><text x="368" y="314">/BI</text>
<text x="368" y="374">D</text><text x="368" y="404">LE</text>
<text x="430" y="118" text-anchor="middle" font-size="11">VDD (16)</text>
<text x="430" y="422" text-anchor="middle" font-size="11">VSS (8)</text>
<text x="352" y="156" text-anchor="end" font-size="10" fill="#777">7</text>
<text x="352" y="186" text-anchor="end" font-size="10" fill="#777">1</text>
<text x="352" y="216" text-anchor="end" font-size="10" fill="#777">2</text>
<text x="352" y="276" text-anchor="end" font-size="10" fill="#777">3</text>
<text x="352" y="306" text-anchor="end" font-size="10" fill="#777">4</text>
<text x="352" y="366" text-anchor="end" font-size="10" fill="#777">6</text>
<text x="352" y="396" text-anchor="end" font-size="10" fill="#777">5</text>
<text x="344" y="366" text-anchor="end" font-size="0"></text>
<text x="326" y="366" text-anchor="end" font-size="10" fill="#1f4e79">GND</text>
<text x="492" y="134" text-anchor="end">a</text>
<text x="492" y="169" text-anchor="end">b</text>
<text x="492" y="204" text-anchor="end">c</text>
<text x="492" y="239" text-anchor="end">d</text>
<text x="492" y="274" text-anchor="end">e</text>
<text x="492" y="309" text-anchor="end">f</text>
<text x="492" y="344" text-anchor="end">g</text>
<g font-size="10" fill="#777">
<text x="506" y="126">13</text><text x="506" y="161">12</text><text x="506" y="196">11</text><text x="506" y="231">10</text>
<text x="506" y="266">9</text><text x="506" y="301">15</text><text x="506" y="336">14</text>
</g>
<g font-size="10" text-anchor="middle">
<text x="570" y="120">R1</text><text x="570" y="155">R2</text><text x="570" y="190">R3</text><text x="570" y="225">R4</text>
<text x="570" y="260">R5</text><text x="570" y="295">R6</text><text x="570" y="330">R7</text>
</g>
<g font-size="9" text-anchor="middle" fill="#555">
<text x="570" y="134">220Ω</text><text x="570" y="169">220Ω</text><text x="570" y="204">220Ω</text><text x="570" y="239">220Ω</text>
<text x="570" y="274">220Ω</text><text x="570" y="309">220Ω</text><text x="570" y="344">220Ω</text>
</g>
</g>

<!-- display text -->
<g font-size="12" fill="#111">
<text x="668" y="134">a (7)</text><text x="668" y="169">b (6)</text><text x="668" y="204">c (4)</text>
<text x="668" y="239">d (2)</text><text x="668" y="274">e (1)</text><text x="668" y="309">f (9)</text><text x="668" y="344">g (10)</text>
<text x="755" y="215" text-anchor="middle" font-weight="bold" font-size="13">DS1 5161AS</text>
<text x="755" y="232" text-anchor="middle" font-size="11">7-segment</text>
<text x="755" y="246" text-anchor="middle" font-size="11">common cathode</text>
<text x="735" y="390" text-anchor="middle" font-size="11">COM (3, 8)</text>
</g>

<!-- notes -->
<g font-size="12" fill="#333">
<text x="40" y="610">D tied to GND (dice only needs 1-6). LE to GND = transparent latch. /LT and /BI to +5V = lamp test and blanking off.</text>
<text x="40" y="628">Power from the USB plug (5V). For batteries, use the 5V pin, not VIN. No separate 0.1µF cap needed (board has one).</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
